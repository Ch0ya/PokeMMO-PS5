# PokeMMO: the settings a PS5 player starts with. Lines in PokeMMO's own config/main.properties format.
# Applied by the loader before the game starts: in full on a new install, and once per DEFAULTS_VERSION on an existing one
# (the player's own changes afterwards stay). Values taken from a console set up by hand (loader-11).
DEFAULTS_VERSION=18
# Fullscreen (the client's own default is a 1024x768 window). The loader requests the largest native display mode
# and rewrites width/height and ui_zoom2 at start to match the surface it got.
client.graphics.display_mode=1
client.graphics.width=1920
client.graphics.height=1080
# Frame rate cap matching the TV.
client.graphics.max_fps=60
# Interface scale for a TV at couch distance. The client's own UI Scaling slider stops at 200% but the stored value is
# honoured a little above it: 2.1 is the slight enlargement the hotbars want. The loader writes this at every start too.
client.gui.scale.ui_zoom2=2.1
# Client 34702 draws a mobile touch overlay (on-screen stick and buttons) unless this is off. It is meant for phones and
# would cover the game on a TV; the pad drives the client's own UI instead.
client.mobile.onscreencontrols.show=false
# Chat box: the client draws its battle window as a fixed 758-unit-high panel in its 1080-high design units and puts
# the panel's bottom edge at 1080 - chatframe.height - 127, so the chat box's height is what places the whole battle
# scene. 34 units puts it at y 161..919, exactly centred; the loader also writes that height (scaled to the interface
# size) at every start (main_ps5.c, applyHudDefaults) because the client rewrites its own settings.
client.gui.hud.chatframe.width=320
client.gui.hud.chatframe.height=34
# Hotbar at the bottom centre, horizontal. The client scales the bar with ui_zoom2 itself, so this keeps it centred and
# flush with the design's bottom edge at every resolution. Client 34702 replaced client.gui.hud.hotkeybar.x/.y with an
# anchor: the value is the client's own "key:inset" form (its chat box default is "left:0,bottom:0"), with the colon
# escaped as the client escapes it. With no anchor the bar sits at the top centre.
client.gui.hud.hotkeybar.anchor=centre\:0,bottom\:0
client.gui.hud.hotkeybar.vertical=false
client.mobile.hotbar.vertical=false
# The login screen's "Remember Me" box, ticked by default: the client has no pad binding for it, so without this a pad
# player cannot save their credentials (the client then keeps them in config/savedcredentials.properties). The client
# leaves the key out when it saves its own settings, so the loader writes it at every start as well (main_ps5.c,
# applyLoginDefaults), not only once per DEFAULTS_VERSION.
client.ui.login.auto=true
# Controller layout (version 13; updated for client 34702/34868): the client's own UI, pad only.
#   Cross A, Square = use the selected hotbar slot (the loader presses 1-9), Triangle Pokedex,
#   Circle = B, the client's cancel/back key: it closes the topmost window and steps back in the battle
#   UI ("B GO BACK"), touchpad bag, Options = the client's menu,
#   L2 = the client's own KEY_RING_FOCUS, which brings up the party hotbar on the right, R3 trainer.
#   L1/R1 move the hotbar selection left/right (the loader draws the marker); holding L1/R1 pages the
#   hotbar up/down (Page Up / Page Down) and repeats, so all of the client's slots are reachable.
#   The d-pad is the client's own (KEY_UP/DOWN/LEFT/RIGHT): it walks, navigates the client's windows
#   and drives the battle command and move grid.
#   The battle move summary is automatic: while the battle's move grid is on screen the loader keeps
#   the pointer on the move the client has selected, so its Power and Accuracy tooltip appears with no
#   button (loader-46).
#   R2 is the client's own menus' keyboard, which the pad cannot reach: a tap is Return (activate the
#   drawn button) and a hold steps with Tab (next field), so the login screen is typed and sent without
#   a cursor.
# Client 34702 reads controller bindings from controller_input_maps_gdx_2 (the old _gdx key is no
# longer read) in "NAME;ACTION,BUTTON,index[,bool]" form. The client generated a broken fallback map
# for the loader's virtual pad, so this is the full default: it binds the actions the client's own
# Control page exposes to the standard SDL button numbers of the PS5 pad. The loader still owns
# L1/R1 (hotbar selection/pages) and Square (use), and R2 (menu keyboard); L2 is the client's ring focus.
# Every action the client knows must be listed: it adds the ones that are missing with its own choices and
# then moves any binding they collide with (in loader-58 it took the touchpad for KEY_RING_FOCUS and pushed
# the bag onto R1, which the loader masks).
client.controls.controller_input_maps_gdx_2=PS5 Controller;KEY_A,BUTTON,0;KEY_B,BUTTON,1;KEY_X,BUTTON,2;KEY_UP,BUTTON,11;KEY_DOWN,BUTTON,12;KEY_LEFT,BUTTON,13;KEY_RIGHT,BUTTON,14;KEY_GAMEMENU,BUTTON,6;KEY_INVENTORY,BUTTON,4;KEY_MONSTERDEX,BUTTON,3;KEY_TRAINER,BUTTON,8;KEY_RING_FOCUS,AXIS,4,true
# Interface and chat language, fixed to English. The client opens its first-run "Chat Language Setup"
# (a mouse-only form with tick boxes and a Save button) whenever a language has not been chosen by
# hand, which a console cannot do: the two *.selected_manually flags are the client's own record of
# that choice, so a new profile starts with the dialog already answered and never sees it.
client.ui.string.lang=en
client.ui.string.lang.selected_manually=true
client.ui.chat.language.current_language=en
client.ui.chat.language.current_language.selected_manually=true
